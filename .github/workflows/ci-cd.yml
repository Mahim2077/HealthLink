name: HealthLink CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: healthlink_test
          POSTGRES_USER: healthlink
          POSTGRES_PASSWORD: healthlink_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthlink -d healthlink_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://healthlink:healthlink_ci_password@127.0.0.1:5432/healthlink_test
      HEALTHLINK_TEST_DATABASE_URL: postgresql+psycopg://healthlink:healthlink_ci_password@127.0.0.1:5432/healthlink_test
      JWT_SECRET_KEY: healthlink-ci-only-secret-key-never-used-outside-github-actions
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      AI_ENABLED: "false"
      AI_PROVIDER: mock
      AI_RECORD_CONTEXT_ENABLED: "false"
      FRONTEND_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up pinned dependency lock tool
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Verify reproducible Python locks
        run: |
          uv pip compile backend/requirements.in --universal --python-version 3.13 --generate-hashes --no-header --output-file backend/requirements.txt --quiet
          uv pip compile backend/requirements-dev.in --universal --python-version 3.13 --generate-hashes --no-header --output-file backend/requirements-dev.txt --quiet
          git diff --exit-code -- backend/requirements.txt backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements-dev.txt
          python -m pip check

      - name: Audit locked Python runtime and development dependencies
        run: |
          python -m pip_audit --strict --disable-pip --require-hashes -s pypi -r backend/requirements.txt
          python -m pip_audit --strict --disable-pip --require-hashes -s pypi -r backend/requirements-dev.txt

      - name: Apply migrations to CI PostgreSQL
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Check Alembic metadata drift
        working-directory: backend
        run: python -m alembic check

      - name: Run backend tests
        run: python -m pytest -q

  frontend-quality:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Test dependency security gate
        working-directory: frontend
        run: npm run test:security

      - name: Audit frontend production and development dependencies
        working-directory: frontend
        run: npm run audit:security

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  release-production:
    name: Migrate, stage, verify and promote production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - backend-quality
      - frontend-quality
    runs-on: ubuntu-latest
    environment: production
    # One non-cancelling lock covers migration, staging, smoke and promotion.
    # Never split this lifecycle into separately locked jobs.
    concurrency:
      group: healthlink-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install migration dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements.txt
          python -m pip check

      - name: Reject stale release before production migration
        run: python scripts/check_release_head.py

      - name: Verify the owner-approved Vercel target
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test "$VERCEL_ORG_ID" = 'team_l9GeumDweBdowhhoxPfAS0yM'
          test "$VERCEL_PROJECT_ID" = 'prj_kQyhfaS1tFS7NXlUMYr9C0FA8W5f'

      - name: Upgrade production database
        working-directory: backend
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install uv for Vercel Python builds
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Install Vercel CLI
        run: npm install --global vercel@59.10.0

      - name: Pull Vercel production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production

      - name: Build both Vercel services
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod

      - name: Reject stale release before staging
        run: python scripts/check_release_head.py

      - name: Stage prebuilt production application without changing live domains
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain)"
          python -c 'import sys; from scripts.smoke_release import validate_target; validate_target(sys.argv[1])' "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke-test staged production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: python scripts/smoke_release.py --vercel-auth "$DEPLOYMENT_URL"

      - name: Reject stale release before promotion
        run: python scripts/check_release_head.py

      - name: Promote the tested production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel promote "$DEPLOYMENT_URL" --yes

      - name: Smoke-test stable production domain after promotion
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          python scripts/smoke_release.py https://healthlink-sd.vercel.app

      - name: Publish deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          {
            echo "### HealthLink production deployment"
            echo ""
            echo "- Application: $DEPLOYMENT_URL"
            echo "- Stable production: https://healthlink-sd.vercel.app/"
            echo "- Health check: $DEPLOYMENT_URL/health"
            echo "- API base: $DEPLOYMENT_URL/api/v1"
          } >> "$GITHUB_STEP_SUMMARY"
