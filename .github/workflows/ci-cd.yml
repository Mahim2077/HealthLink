name: HealthLink CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: healthlink_test
          POSTGRES_USER: healthlink
          POSTGRES_PASSWORD: healthlink_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthlink -d healthlink_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://healthlink:healthlink_ci_password@127.0.0.1:5432/healthlink_test
      HEALTHLINK_TEST_DATABASE_URL: postgresql+psycopg://healthlink:healthlink_ci_password@127.0.0.1:5432/healthlink_test
      JWT_SECRET_KEY: healthlink-ci-only-secret-key-never-used-outside-github-actions
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      FRONTEND_URL: http://localhost:3000
      PRESCRIPTION_STORAGE_BACKEND: local
      PRESCRIPTION_STORAGE_PATH: /tmp/healthlink-prescriptions
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip check

      - name: Apply migrations to CI PostgreSQL
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Check Alembic metadata drift
        working-directory: backend
        run: python -m alembic check

      - name: Run backend tests
        run: python -m pytest -q

  frontend-quality:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  migrate-production:
    name: Migrate production database
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - backend-quality
      - frontend-quality
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: healthlink-production
      cancel-in-progress: false
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Upgrade production database
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic current

  deploy-production:
    name: Deploy healthlink to Vercel
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - migrate-production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: healthlink-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv for Vercel Python builds
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Install Vercel CLI
        run: npm install --global vercel@59.10.0

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build both Vercel services
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt application
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke-test frontend and API
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "$DEPLOYMENT_URL/health"
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --head "$DEPLOYMENT_URL/"

      - name: Publish deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          {
            echo "### HealthLink production deployment"
            echo ""
            echo "- Application: $DEPLOYMENT_URL"
            echo "- Health check: $DEPLOYMENT_URL/health"
            echo "- API base: $DEPLOYMENT_URL/api/v1"
          } >> "$GITHUB_STEP_SUMMARY"
