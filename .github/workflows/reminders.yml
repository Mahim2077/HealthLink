name: Deliver in-app reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: healthlink-reminder-worker
  cancel-in-progress: false

jobs:
  deliver:
    if: vars.REMINDERS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Invoke protected worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo 'CRON_SECRET is required to run reminders.'
            exit 1
          fi
          curl --fail --silent --show-error --max-time 120 \
            --retry 2 --retry-delay 5 --output /dev/null \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://healthlink-sd.vercel.app/api/v1/jobs/reminders
